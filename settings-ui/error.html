<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>加载失败</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/error.css" />
  </head>
  <body>
    <main id="app">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 2.5 20h19L12 3Z" />
          <path d="M12 10v4.5" />
          <circle cx="12" cy="17.2" r="0.4" fill="currentColor" />
        </svg>
      </div>
      <h1>页面加载失败</h1>
      <p id="reason" class="selectable" role="status" aria-live="polite">网络连接异常</p>
      <p class="hint">请检查网络连接后重试；若使用代理，请确认系统代理设置正常。</p>
      <button id="retry" type="button">重试</button>
      <p id="countdown" role="status" aria-live="polite" aria-atomic="true">稍后将自动重试</p>
    </main>
    <script type="module" src="/src/error.ts"></script>
  </body>
</html>
