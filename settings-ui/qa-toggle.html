<!doctype html>
<!--
  浏览器侧 QA 页：在纯 Chromium 里跑真实的 settings.css + settings.ts，
  用来量测开关圆点与分段胶囊的几何（真机 WebView2 里做不到逐帧采样）。
  用法：cd settings-ui; npm run dev → 打开 http://localhost:5173/qa-toggle.html
  打桩两点：__TAURI__（invoke/listen）；setPointerCapture（合成指针事件没有活动
  指针，不垫片会抛 NotFoundError，拖动路径就跑不起来；垫片只记录 capture 状态，
  gotpointercapture/lostpointercapture 事件仍不会触发，依赖事件重定向的量测不适用）。
  注意：控件 id 与 settings.html 保持一致；页尾有同步断言，结构漂移会直接报错，
  而不是渲染成半初始化的空壳。
  不参与 npm run build（vite 的 rollup input 只列了三个正式页面）。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>QA toggle</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/settings.css" />
    <script>
      // capture 垫片：记录状态贴近真实语义（真实 capture 会把后续指针事件重定向
      // 到捕获元素；合成事件本就派发给目标，记录状态仅供断言用）
      Element.prototype.setPointerCapture = function (pointerId) {
        (this.__qaCapture ??= new Set()).add(pointerId);
      };
      Element.prototype.releasePointerCapture = function (pointerId) {
        this.__qaCapture?.delete(pointerId);
      };
      window.__QA = {
        config: { closeAction: "Hide", lowMemoryMode: false, autostart: false },
        dark: false,
        // 设为命令名可模拟该命令失败（如 "open_data_dir"），验证错误回弹路径
        failInvoke: null,
        handlers: [],
      };
      window.__TAURI__ = {
        core: {
          invoke: async (cmd, args) => {
            const qa = window.__QA;
            if (qa.failInvoke === cmd) throw new Error(`QA: 模拟 ${cmd} 失败`);
            const c = qa.config;
            switch (cmd) {
              case "get_config": return { ...c };
              case "set_config": { Object.assign(c, args.patch); return { ...c }; }
              case "get_theme": return { dark: !!qa.dark };
              case "get_data_dir": return "QA:\\data";
              case "open_data_dir":
              case "open_project_home":
                return null;
              default:
                // 与真实 Tauri 一致：未知命令必须 reject，契约漂移在此立刻暴露
                throw new Error(`QA stub 未实现命令: ${cmd}`);
            }
          },
        },
        event: {
          // 返回 unlisten 函数（与真实 Tauri 契约一致）；保存 handler 供手动模拟事件：
          // __QA.handlers.find(h => h.event === "theme-changed").handler({ payload: { dark: true } })
          listen: async (event, handler) => {
            window.__QA.handlers.push({ event, handler });
            return () => {};
          },
        },
      };
    </script>
  </head>
  <body>
    <main id="app">
      <h1>设置</h1>
      <div class="section-label">通用</div>
      <div class="card">
        <div class="card-text"><div class="card-title">开机自启动</div><div class="card-sub">登录 Windows 后自动运行</div></div>
        <div id="toggle-autostart" class="toggle" role="switch" tabindex="0" aria-checked="false" aria-label="开机自启动"></div>
      </div>
      <div class="section-label">窗口</div>
      <div class="card">
        <div class="card-text"><div class="card-title">关闭按钮行为</div><div class="card-sub">点击窗口右上角 ✕ 时</div></div>
        <div class="segmented" role="radiogroup" aria-label="关闭按钮行为">
          <button id="seg-hide" type="button" role="radio" aria-checked="false">最小化到托盘</button>
          <button id="seg-exit" type="button" role="radio" aria-checked="false">直接退出</button>
        </div>
      </div>
      <div class="section-label">性能</div>
      <div class="card">
        <div class="card-text"><div class="card-title">极致省内存模式</div><div class="card-sub">禁用 GPU 硬件加速，重启后生效</div></div>
        <div id="toggle-lowmem" class="toggle" role="switch" tabindex="0" aria-checked="false" aria-label="极致省内存模式"></div>
      </div>
      <footer id="footer"><button id="data-dir" type="button" class="footer-link">数据目录：…</button><button id="about" type="button" class="footer-link">关于DeepSeekChat</button></footer>
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script>
      // 结构漂移断言：settings.ts 依赖的控件缺失时立刻失败（真实页里 $() 抛错被
      // init 捕获成 toast，这里要让 QA 直接红牌，避免在坏布局上做无效量测）
      for (const id of ["toggle-autostart", "seg-hide", "seg-exit", "toggle-lowmem", "data-dir", "about", "toast"]) {
        if (!document.getElementById(id)) {
          throw new Error(`[QA] 缺少控件 #${id}：qa-toggle.html 与 settings.html 结构漂移`);
        }
      }
    </script>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
